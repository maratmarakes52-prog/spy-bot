:root{--bg:#050507;--panel:#101014;--line:#292932;--muted:#92929e;--white:#f6f6f8;--violet:#9b72ff;--cyan:#66e5d2}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 38%,#171020 0%,#09090d 43%,#030304 100%);color:var(--white);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;overflow-x:hidden;display:flex;justify-content:center;align-items:center;padding:26px 16px;}
.bgfx{position:fixed;inset:0;overflow:hidden;pointer-events:none;opacity:.78}.bgfx svg{position:absolute;width:min(1050px,130vw);height:110vh;left:50%;top:50%;transform:translate(-50%,-50%)}.tentacle{fill:none;stroke:#39264e;stroke-width:17;stroke-linecap:round;opacity:.42;filter:drop-shadow(0 0 13px #7b39a833);stroke-dasharray:18 12;animation:creep 24s linear infinite}.tentacle.t2{stroke:#252534;stroke-width:11;animation-duration:31s;animation-direction:reverse}.tentacle.t3{stroke:#59366c;stroke-width:7;opacity:.22;animation-duration:37s}@keyframes creep{to{stroke-dashoffset:600}}
.app{position:relative;width:min(100%,440px);z-index:1}.top{display:flex;align-items:center;gap:12px;margin:0 0 26px 2px}.brandmark{width:48px;height:48px;border-radius:14px;background:#f4f4f4;display:grid;place-items:center;overflow:hidden;box-shadow:0 0 28px #a77aff22}.brandmark img{width:100%;height:100%;object-fit:contain}.brandtxt{font-size:14px;font-weight:850;letter-spacing:.17em}.brandtxt small{display:block;margin-top:4px;font-size:10px;letter-spacing:.22em;color:#85818f;font-weight:600}
.panel{border:1px solid #ffffff16;background:linear-gradient(145deg,#17151eeb,#0c0c11f2);border-radius:28px;padding:23px;box-shadow:0 24px 90px #000b, inset 0 1px #ffffff0d;backdrop-filter:blur(18px)}.eyebrow{display:flex;justify-content:space-between;align-items:center;color:#a7a3b1;font-size:10px;font-weight:800;letter-spacing:.18em;text-transform:uppercase}.status{display:flex;align-items:center;gap:7px;color:#a9a4b3;font-size:10px;letter-spacing:.1em}.dot{width:7px;height:7px;background:var(--cyan);border-radius:50%;box-shadow:0 0 12px var(--cyan)}h1{font-size:clamp(27px,7vw,34px);line-height:1.08;margin:17px 0 9px;letter-spacing:-.045em}.sub{color:#9995a2;font-size:13px;line-height:1.55;margin:0 0 22px}.qr-wrap{position:relative;padding:12px;border-radius:22px;background:linear-gradient(145deg,#fff,#dedee4);width:min(100%,290px);margin:0 auto 22px;box-shadow:0 0 0 1px #ffffff25,0 18px 55px #0009;overflow:hidden}.qr{display:block;width:100%;height:auto;border-radius:9px}.scanbeam{position:absolute;left:12px;right:12px;top:12px;height:3px;background:linear-gradient(90deg,transparent,#7dffec,#fff,#9d76ff,transparent);box-shadow:0 0 12px #8affed,0 0 28px #9c70ff;opacity:0;z-index:2}.qr-wrap.scanning .scanbeam{opacity:1;animation:scan 2.2s ease-in-out infinite alternate}@keyframes scan{from{top:12px}to{top:calc(100% - 15px)}}.qr-wrap.scanning:after{content:"";position:absolute;inset:12px;background:linear-gradient(transparent,#9b72ff18,transparent);animation:glow 2.2s linear infinite;pointer-events:none}@keyframes glow{from{transform:translateY(-100%)}to{transform:translateY(100%)}}
.scanbtn{width:100%;border:0;border-radius:16px;padding:17px 18px;background:linear-gradient(105deg,#a77cff,#7652d9);color:#fff;font-weight:900;letter-spacing:.12em;font-size:12px;cursor:pointer;box-shadow:0 9px 30px #8c62ff38;transition:transform .2s,filter .2s}.scanbtn:active{transform:scale(.985)}.scanbtn:disabled{opacity:.72;cursor:default}.progress{height:4px;background:#292631;border-radius:20px;margin-top:17px;overflow:hidden;opacity:0;transition:opacity .2s}.progress.show{opacity:1}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--violet),var(--cyan));border-radius:20px;transition:width .12s linear}.hint{text-align:center;color:#777482;font-size:11px;margin:12px 0 0;min-height:16px}.result{display:none;margin-top:19px;padding:16px;border:1px solid #6ce4d32e;border-radius:17px;background:#10201e66;animation:appear .45s ease both}.result.show{display:block}@keyframes appear{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}.resulthead{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:850;letter-spacing:.13em;color:var(--cyan);text-transform:uppercase}.url{margin:12px 0 14px;word-break:break-all;font-size:15px;font-weight:700;color:#f4f2fa}.copy{width:100%;border:1px solid #ffffff24;border-radius:12px;background:#ffffff0b;color:#fff;padding:12px;font-size:11px;font-weight:800;letter-spacing:.1em;cursor:pointer}.foot{text-align:center;color:#66636f;font-size:10px;letter-spacing:.08em;margin:17px 0 0}.foot span{color:#9380b4}@media(max-width:380px){.panel{padding:18px}.qr-wrap{width:min(100%,260px)}}
